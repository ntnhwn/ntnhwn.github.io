          letter-spacing="1">CLOUD</text>
  </g>

  <!-- Main wordmark -->
  <text x="0" y="88"
        font-family="Poppins, 'Arial Rounded MT Bold', 'Segoe UI', sans-serif"
        font-weight="800"
        font-size="56"
