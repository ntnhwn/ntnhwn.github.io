<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <metadata>image/svg+xml</metadata>
  <title>Thien Nhan Cloud</title>

  <!-- Cloud icon + "CLOUD" label -->
